<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgCore" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#151030"/>
      <stop offset="55%" stop-color="#0a0818"/>
      <stop offset="100%" stop-color="#04030a"/>
    </radialGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#40ffea"/>
      <stop offset="35%" stop-color="#7c5cff"/>
      <stop offset="70%" stop-color="#c74bff"/>
      <stop offset="100%" stop-color="#ff4f9a"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#40ffea" stop-opacity="0"/>
      <stop offset="50%" stop-color="#c74bff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ff4f9a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orbPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowSoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowStrong" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="stars" width="120" height="120" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="15" r="1" fill="#ffffff" fill-opacity="0.5"/>
      <circle cx="55" cy="40" r="0.7" fill="#ffffff" fill-opacity="0.35"/>
      <circle cx="95" cy="20" r="1.1" fill="#7dd3fc" fill-opacity="0.5"/>
      <circle cx="30" cy="80" r="0.8" fill="#ffffff" fill-opacity="0.4"/>
      <circle cx="80" cy="95" r="1" fill="#c084fc" fill-opacity="0.45"/>
      <circle cx="110" cy="70" r="0.6" fill="#ffffff" fill-opacity="0.3"/>
    </pattern>
    <linearGradient id="vignette" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.35"/>
      <stop offset="15%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="85%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" fill="url(#bgCore)"/>
  <rect width="1200" height="360" fill="url(#stars)"/>
  <circle cx="130" cy="60" r="220" fill="url(#orbPurple)"/>
  <circle cx="1090" cy="90" r="240" fill="url(#orbCyan)"/>
  <circle cx="600" cy="360" r="300" fill="url(#orbPink)"/>

  <g stroke="#8ee9ff" stroke-opacity="0.55" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M28,20 L28,50 M28,20 L58,20"/>
    <path d="M1172,20 L1172,50 M1172,20 L1142,20"/>
    <path d="M28,340 L28,310 M28,340 L58,340"/>
    <path d="M1172,340 L1172,310 M1172,340 L1142,340"/>
  </g>
  <g stroke="#8ee9ff" stroke-opacity="0.15" stroke-width="1" fill="none">
    <rect x="14" y="14" width="1172" height="332" rx="4"/>
  </g>

  <circle cx="52" cy="42" r="4.5" fill="#4ade80" filter="url(#glowSoft)"/>
  <text x="66" y="46" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#86efac" letter-spacing="1">STATUS: BUILDING</text>

  <text x="1134" y="46" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#7dd3fc" letter-spacing="1" text-anchor="end">OPEN TO ROLES →</text>

  <g stroke="#7dd3fc" stroke-opacity="0.4" stroke-width="1" fill="none">
    <path d="M960,80 L1010,62 L1058,82 L1105,66"/>
    <path d="M1010,62 L1016,102 L1063,118"/>
  </g>
  <g fill="#40ffea">
    <circle cx="960" cy="80" r="2"/>
    <circle cx="1010" cy="62" r="2.6"/>
    <circle cx="1058" cy="82" r="2"/>
    <circle cx="1105" cy="66" r="2.6"/>
    <circle cx="1016" cy="102" r="2"/>
    <circle cx="1063" cy="118" r="2"/>
  </g>

  <text x="600" y="98" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#8ee9ff" text-anchor="middle" letter-spacing="4" opacity="0.9">
    &gt; whoami --engineer --focus=AI_SYSTEMS
  </text>

  <text x="600" y="196" font-family="Arial, Helvetica, sans-serif" font-size="86" font-weight="800" fill="url(#nameGrad)" text-anchor="middle" filter="url(#glowStrong)" letter-spacing="1" opacity="0.55">
    VISHAL DEEP
  </text>
  <text x="600" y="196" font-family="Arial, Helvetica, sans-serif" font-size="86" font-weight="800" fill="url(#nameGrad)" text-anchor="middle" letter-spacing="1">
    VISHAL DEEP
  </text>

  <text x="150" y="215" font-family="Consolas, 'Courier New', monospace" font-size="58" font-weight="700" fill="#7c5cff" fill-opacity="0.4">&lt;/&gt;</text>
  <text x="985" y="215" font-family="Consolas, 'Courier New', monospace" font-size="58" font-weight="700" fill="#22d3ee" fill-opacity="0.4">{ }</text>

  <rect x="340" y="228" width="520" height="2" fill="url(#lineGrad)" filter="url(#glowSoft)"/>

  <text x="600" y="262" font-family="Consolas, 'Courier New', monospace" font-size="19" fill="#f1f5f9" text-anchor="middle" letter-spacing="1.5">
    Full Stack Developer  •  AI Systems Builder  •  Problem Solver
  </text>

  <g font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="600">
    <rect x="330" y="286" width="94" height="30" rx="15" fill="#7c5cff26" stroke="#7c5cff" stroke-width="1.2"/>
    <text x="377" y="306" fill="#c9b8ff" text-anchor="middle">Next.js</text>

    <rect x="436" y="286" width="88" height="30" rx="15" fill="#22d3ee26" stroke="#22d3ee" stroke-width="1.2"/>
    <text x="480" y="306" fill="#a5f3fc" text-anchor="middle">Node.js</text>

    <rect x="536" y="286" width="118" height="30" rx="15" fill="#ec489926" stroke="#ec4899" stroke-width="1.2"/>
    <text x="595" y="306" fill="#fbcfe8" text-anchor="middle">Gemini AI</text>

    <rect x="666" y="286" width="102" height="30" rx="15" fill="#7c5cff26" stroke="#7c5cff" stroke-width="1.2"/>
    <text x="717" y="306" fill="#c9b8ff" text-anchor="middle">MongoDB</text>

    <rect x="780" y="286" width="86" height="30" rx="15" fill="#22d3ee26" stroke="#22d3ee" stroke-width="1.2"/>
    <text x="823" y="306" fill="#a5f3fc" text-anchor="middle">Docker</text>
  </g>

  <rect width="1200" height="360" fill="url(#vignette)"/>
</svg>
